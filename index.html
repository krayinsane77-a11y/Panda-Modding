<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda Modding Hub</title>
    <style>
        /* Forces the native Windows Snipping Tool precision crosshair everywhere universally */
        *, html, body, .bio-container, a, button, .btn-link {
            cursor: crosshair !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Smoothly moving animated neon light-blue gradient background layout */
        body {
            background: linear-gradient(-45deg, #0a2540, #00d2ff, #3a7bd5, #0a192f);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Central Light Blue Glassmorphism Box */
        .bio-container {
            background: rgba(25, 45, 70, 0.45); /* Translucent electric ice blue */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 210, 255, 0.4);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 420px;
            color: #ffffff;
            box-shadow: 0 10px 35px rgba(0, 210, 255, 0.4);
            z-index: 10;
        }

        /* Profile Picture Circular Frame Styling */
        .pfp-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 15px auto;
            display: block;
            border: 2.5px solid rgba(0, 210, 255, 0.9);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.7);
        }

        .bio-container h2 {
            margin-bottom: 5px;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.9);
        }

        .bio-container p {
            color: #e0f7fc;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Interactive Light Blue Hyperlink Buttons */
        .btn-link {
            display: block;
            background: rgba(0, 210, 255, 0.15);
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            margin: 12px 0;
            border-radius: 10px;
            font-weight: 600;
            border: 1px solid rgba(0, 210, 255, 0.4);
            transition: all 0.3s ease;
        }

        .btn-link:hover {
            background: #00d2ff;
            color: #0a192f; /* Dark text for contrast on hover */
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.7);
        }

        /* Highlighted/Glowing Download Button Variant for File Installers */
        .btn-download {
            border: 1px solid #00d2ff;
            background: rgba(0, 210, 255, 0.3);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.5);
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        .btn-download:hover {
            background: #ffffff;
            color: #0a2540; /* Darker navy text for strong readability against white */
            box-shadow: 0 0 25px rgba(0, 210, 255, 1);
        }
    </style>
</head>
<body>

    <!-- Central Main Info Link Hub Panel -->
    <div class="bio-container">
        <!-- Working direct-link profile avatar template -->
        <img class="pfp-avatar" src="download.jpg" alt="Profile Picture">
        <h2>Panda Modding</h2>
        <p>Links</p>
        
        <!-- Social Media Redirection Links -->
        <a href="https://discord.com" target="_blank" class="btn-link">EIC Modding Discord</a>
        <a href="https://discord.com/channels/1537928885486751834/1540939261610696734" target="_blank" class="btn-link">Buy Supporter here!</a>
        <a href="https://discord.com" target="_blank" class="btn-link">Crystal Discord</a>
    </div>

</body>
</html>
